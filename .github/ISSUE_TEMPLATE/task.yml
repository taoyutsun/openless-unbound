name: 功能 / 維護任務
description: 提出 OpenLess Unbound 的功能、文件、維護或驗證任務。
title: "[area] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        請盡量使用繁體中文描述。若提案牽涉上游 OpenLess 行為，請說明是否希望維持相容。
  - type: textarea
    id: goal
    attributes:
      label: 目標
      description: 說明希望改善什麼限制或新增什麼能力。
      placeholder: |
        - 目前限制：
        - 希望達成：
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 驗收方式
      description: 寫下完成後可以如何確認。
      placeholder: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 補充說明
      description: 可補充設計考量、截圖、相關 issue 或測試方式。
