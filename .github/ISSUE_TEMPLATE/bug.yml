name: 問題 / 缺陷
description: 回報 OpenLess Unbound 可重現或可檢查的問題。
title: "[area] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        請盡量使用繁體中文描述。若問題也存在於上游 OpenLess，請在內容中註明。
  - type: textarea
    id: symptom
    attributes:
      label: 現象
      description: 描述觸發條件、目前表現、截圖或 log。
      placeholder: |
        - 觸發條件：
        - 目前表現：
        - 預期表現：
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 環境
      description: 請填寫 OS、OpenLess Unbound 版本、ASR / LLM provider、是否使用安裝版或 portable。
      placeholder: |
        - OS：
        - 版本：
        - ASR：
        - LLM：
        - 安裝方式：
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 補充證據
      description: 可貼上錯誤訊息、錄影、截圖、log 或其他可協助重現的資訊。
